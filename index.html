<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Personal Profile</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 30px; text-align: center; }
        .card { background: white; max-width: 500px; margin: 0 auto; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h2 { color: #0056b3; }
        ul { text-align: left; display: inline-block; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Personal Profile</h2>
        <p><strong>Name:</strong> John Doe</p>
        <p><strong>Register Number:</strong> REG12345678</p>
        <p><strong>Department:</strong> Information Technology</p>
        <p><strong>Career Objective:</strong> To build a successful career as a DevOps Engineer using cloud-native platforms.</p>
        <p><strong>Skills:</strong></p>
        <ul>
            <li>Docker & Kubernetes</li>
            <li>Git & Version Control</li>
            <li>Linux Core Basics</li>
        </ul>
    </div>
</body>
</html>
